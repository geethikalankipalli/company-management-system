{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Project</title>

    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>

<div class="sidebar">
    <h2>IT Company</h2>

    <a href="/">Dashboard</a>
    <a href="/employees/" class="active">Employees</a>
    <a href="#">Projects</a>
    <a href="#">Tasks</a>
    <a href="#">Departments</a>
    <a href="#">Reports</a>
</div>

<main class="content">

    <div class="topbar">
        <div>
            <h1>Delete Project</h1>
            <p>Remove a project from the company database</p>
        </div>
    </div>

    <div class="employee-container">

        <h2>Confirm Delete</h2>

        <p>
            Are you sure you want to delete
            <strong>{{ project.name }}</strong>?
        </p>

        <br>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="delete-btn">
                Yes, Delete project
            </button>

            <a href="/projects/" class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</main>

</body>
</html>
